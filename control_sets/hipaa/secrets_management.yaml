controls:
  - id: "HIPAA-164.312(a)(2)(iv)-SECRETS"
    title: "Encryption - Secrets Management"
    description: "Secrets and credentials must be encrypted, rotated, and never hardcoded in templates."
    category: "Technical Safeguards - Access Control"
    severity: "HIGH"
    artifact_types: ["iac"]
    validation_rules:
      - rule_id: "HIPAA-SEC-KMS"
        description: "Secrets Manager secrets must use KMS CMK encryption"
        check_type: "resource_property"
        resource_types: ["AWS::SecretsManager::Secret"]
        required_properties:
          KmsKeyId: null
      - rule_id: "HIPAA-SEC-ROTATION"
        description: "Secrets must have automatic rotation configured"
        check_type: "resource_property"
        resource_types: ["AWS::SecretsManager::Secret"]
        required_properties:
          RotationRules: null
      - rule_id: "HIPAA-SEC-GENERATED"
        description: "Secrets should use generated values, not hardcoded SecretString"
        check_type: "resource_property"
        resource_types: ["AWS::SecretsManager::Secret"]
        required_properties:
          GenerateSecretString: null
    evidence_requirements:
      - "Secrets encrypted with KMS CMK"
      - "Automatic rotation configured"
      - "No plaintext secrets in templates"
    remediation_guidance: "Use KmsKeyId for CMK encryption. Configure RotationRules with AutomaticallyAfterDays <= 90. Use GenerateSecretString instead of hardcoded SecretString."
